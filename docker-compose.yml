# Development environment for SmartPOS.
#
# This brings up the database only. The PyQt5 desktop application itself runs
# natively on the developer's machine, because a GUI application needs a display
# server that a container does not have.
#
#   docker compose up -d        start MySQL (+ phpMyAdmin)
#   docker compose down         stop, keep data
#   docker compose down -v      stop and delete the data volume

services:
  db:
    image: mysql:8.0
    container_name: smartpos-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-smartpos}
      MYSQL_USER: ${DB_USER:-smartpos}
      MYSQL_PASSWORD: ${DB_PASSWORD:-smartpos}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Every .sql file here runs once, in filename order, on first startup.
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/smartpos.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:5
    container_name: smartpos-phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"

volumes:
  db_data:
